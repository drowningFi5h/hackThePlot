name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: htp
          POSTGRES_PASSWORD: htp
          POSTGRES_DB: htp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U htp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgresql://htp:htp@127.0.0.1:5432/htp
      BACKEND_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend
      - name: Check Python lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: backend
      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Run backend tests against PostgreSQL
        run: uv run manage.py test --settings=config.test_settings
        working-directory: backend
      - name: Apply migrations to browser test database
        run: uv run manage.py migrate --noinput
        working-directory: backend
      - name: Generate and validate OpenAPI schema
        run: uv run manage.py spectacular --file ../docs/openapi.yaml --validate --fail-on-warn
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Generate API types
        run: npm run api:types
        working-directory: frontend
      - name: Check generated API files are committed
        run: git diff --exit-code docs/openapi.yaml frontend/src/types/api.d.ts
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Check TypeScript
        run: npm run typecheck
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Seed browser test data
        run: |
          uv run manage.py seed_demo
          uv run manage.py seed_browser_fixtures
        working-directory: backend
      - name: Start Django and Next.js
        run: |
          cd backend
          .venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --threads 2 > /tmp/htp-backend.log 2>&1 &
          cd ../frontend
          npm start > /tmp/htp-frontend.log 2>&1 &
      - name: Wait for both servers
        run: |
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl --max-time 3 -fsS http://127.0.0.1:8000/health/ready/ >/dev/null &&
               curl --max-time 3 -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Django or Next.js did not become ready within 120 seconds." >&2
          exit 1
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Collect server logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          for log in /tmp/htp-backend.log /tmp/htp-frontend.log; do
            if [ -f "$log" ]; then cp "$log" ci-logs/; fi
          done
      - name: Upload browser reports and failure logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            docs/screenshots/
            ci-logs/

services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: htp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-htp}
      POSTGRES_DB: htp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htp -d htp"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgresql://htp:${POSTGRES_PASSWORD:-htp}@db:5432/htp
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:

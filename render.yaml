services:
  - type: web
    name: hacktheplot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready/
    autoDeployTrigger: off
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CERTIFICATE_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hacktheplot-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: "1"
      - key: FRONTEND_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
databases:
  - name: hacktheplot-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hacktheplot
    user: hacktheplot
    ipAllowList: []
